# Two workers that share nothing but the cluster and the session directory, plus a client that is
# only ever a client. On one host "another worker" is another process reading the same disk, which
# proves less than it looks like: here each worker has its own filesystem, its own hostname, and no
# way to reach the other except through Temporal and /sessions.
#
#   docker compose -f docker/compose.yml up -d temporal worker-a
#   docker compose -f docker/compose.yml run --rm client start "..."
#
# /sessions is a local volume here, which answers the exclusive-create and atomic-rename questions
# by construction. `NFS=1` puts it on a real NFSv4 server instead (docker/compose.nfs.yml), which is
# the shape that tests them rather than assuming them.

name: pi-temporal-l3

services:
  # The dev server, not auto-setup: this needs no external database, and nothing here outlives the
  # run. --ip 0.0.0.0 because the other containers reach it by service name.
  temporal:
    image: temporalio/admin-tools:1.29
    # The image's own entrypoint is `sleep infinity`, so a command alone becomes arguments to sleep
    # and the server never runs.
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn"]
    ports:
      - "7242:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker-a: &worker
    image: pi-temporal:l3
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - PI_SESSION_DIR=/sessions
      - PI_TEMPORAL_TASK_QUEUE=${PI_TEMPORAL_TASK_QUEUE:-pi-session}
      - PI_TEMPORAL_STEPPED=1
      - PI_TEMPORAL_SHIP_TREE=${PI_TEMPORAL_SHIP_TREE:-0}
      # Where the tools run. Each worker gets its own, so a project only reaches a second host by
      # travelling with the session.
      - PI_PROJECT_DIR=/project
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY}
    volumes:
      - sessions:/sessions

  worker-b:
    <<: *worker

  # No worker inside it. It reaches the session through Temporal and the shared directory, which is
  # the whole claim: a client needs an endpoint and an id, never a particular host.
  client:
    <<: *worker
    entrypoint: ["node", "--import", "tsx", "src/cli.ts"]
    command: ["running"]
    # Its own project, because with the tree on the client is what sends it. A client that has no
    # project has nothing to send, and it used to send an empty tree that then became the project
    # on every worker.
    volumes:
      - sessions:/sessions
      - clientproject:/project

volumes:
  sessions:
  clientproject:
