version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker-compose
    directory: /docker
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
