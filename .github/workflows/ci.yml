name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fork.pin
      - run: npm ci
      # After `npm ci`, which removes the fork link.
      - run: scripts/setup-fork.sh
      - run: npm run typecheck
  # Replays the kept histories against this code. No server, so it's fast and it fails on its own
  # line when a change would break sessions that are still running.
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx checks/replay-kept-check.mts
  # Runs the real activities and workflows against a dev server. The lock, claim and tree rules
  # are only tested here.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fork.pin
      - run: npm ci
      - run: scripts/setup-fork.sh
      # Local fork overrides must not weaken CI's validation of the shipped build.
      - name: Validate the pinned fork
        run: |
          . scripts/pinned-fork.sh
          pinned_fork
      # A pinned release, checked against its published SHA-256, not an unpinned install script.
      - name: Install the Temporal CLI
        env:
          VERSION: "1.9.1"
          SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
        run: |
          tarball="temporal_cli_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/temporalio/cli/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.temporalio/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.temporalio/bin" temporal
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Start a dev server
        run: |
          temporal server start-dev --headless --log-level warn \
            --search-attribute PiSessionState=Keyword > "$RUNNER_TEMP/temporal.log" 2>&1 &
          for _ in $(seq 1 60); do
            temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/temporal.log"
          exit 1
      - run: npm run checks
      # Restarting a worker's own container needs Docker.
      - run: docker/restart-check.sh
