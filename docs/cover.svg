<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc">
  <title id="title">pi-temporal: the Pi coding agent on Temporal</title>
  <desc id="desc">You type a task in pi. A session Workflow on Temporal sends each step to a Worker. When Worker A is lost, the step moves to Worker B, and the turn goes on. Every Worker reads and appends the same session file.</desc>
  <defs>
    <style>
      .mono { font-family: "Noto Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .node { fill: #1E2033; stroke: #C7D7FE; stroke-width: 1.5; }
      .label { fill: #F8FAFC; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .edge { stroke: #7C8FB1; stroke-width: 1.5; fill: none; }
      .small { fill: #7C8FB1; font-size: 11px; }
    </style>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#465A78" opacity="0.35"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#7C8FB1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#59FDA0"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#ED360E"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="#161723" stroke="#2B2E45" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="318" rx="16" fill="url(#dots)"/>

  <!-- Left: name, what it does, and what you type -->
  <g>
    <text x="48" y="112" class="mono" font-size="44" font-weight="700">
      <tspan fill="#59FDA0">pi</tspan><tspan fill="#FFFFFF">-temporal</tspan>
    </text>
    <text x="48" y="150" class="sans" font-size="17" fill="#C7D7FE">The Pi coding agent on Temporal.</text>
    <text x="48" y="176" class="sans" font-size="17" fill="#C7D7FE">Turns outlive the Worker that runs them.</text>

    <rect x="48" y="202" width="392" height="44" rx="8" fill="#1E2033" stroke="#2B2E45"/>
    <text x="66" y="230" class="mono" font-size="15">
      <tspan fill="#59FDA0">&gt;</tspan><tspan fill="#F8FAFC" dx="8">/background fix the failing test</tspan>
    </text>
  </g>

  <!-- Right: pi hands the turn to a session Workflow, which picks a live Worker for each step -->
  <g>
    <!-- pi -> Workflow -->
    <line class="edge" x1="566" y1="82" x2="634" y2="82" marker-end="url(#arrow)"/>
    <text x="600" y="72" class="mono small" text-anchor="middle">prompt</text>

    <!-- Workflow -> Workers -->
    <path d="M 680,98 C 670,124 640,132 628,152" fill="none" stroke="#ED360E" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
    <line x1="737" y1="98" x2="737" y2="150" stroke="#59FDA0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <path d="M 794,98 C 804,124 834,132 846,152" fill="none" stroke="#59FDA0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="772" y="132" class="mono" font-size="11" fill="#59FDA0">step moves on</text>

    <!-- Workers -> one session file -->
    <path d="M 737,190 L 737,232" class="edge" marker-end="url(#arrow)"/>
    <path d="M 852,190 C 852,214 812,220 790,234" class="edge" marker-end="url(#arrow)"/>
    <text x="745" y="216" class="mono small">read, append</text>

    <!-- nodes -->
    <rect x="518" y="66" width="46" height="32" rx="8" class="node"/>
    <text x="541" y="86" class="mono label">pi</text>

    <rect x="636" y="66" width="202" height="32" rx="8" fill="#1E2033" stroke="#59FDA0" stroke-width="1.5"/>
    <g transform="translate(656, 82) scale(0.026) translate(-583, -585)">
      <path fill="#FFFFFF" d="M651.14,517.35C642.02,449.03,618.94,392,583.49,392s-58.53,57.03-67.65,125.35c-68.32,9.12-125.35,32.2-125.35,67.65s57.04,58.53,125.35,67.65c9.12,68.31,32.2,125.35,67.65,125.35s58.53-57.04,67.65-125.35c68.32-9.12,125.35-32.2,125.35-67.65S719.45,526.47,651.14,517.35z M513.61,632.75c-65.43-9.45-103.59-31.08-103.59-47.75s38.16-38.3,103.59-47.75c-1.44,15.75-2.19,31.83-2.19,47.75C511.42,600.92,512.17,617.01,513.61,632.75z M583.49,411.53c16.67,0,38.3,38.16,47.75,103.59c-15.74-1.44-31.83-2.19-47.75-2.19s-32.01,0.75-47.75,2.19C545.19,449.69,566.82,411.53,583.49,411.53z M653.37,632.75c-3.22,0.47-16.43,2.02-19.77,2.35c-0.33,3.35-1.89,16.55-2.35,19.77c-9.45,65.43-31.08,103.59-47.75,103.59s-38.3-38.16-47.75-103.59c-0.46-3.22-2.02-16.43-2.35-19.77c-1.52-15.51-2.44-32.17-2.44-50.1s0.92-34.59,2.44-50.11c15.51-1.52,32.17-2.44,50.1-2.44s34.59,0.92,50.1,2.44c3.35,0.33,16.55,1.89,19.77,2.35c65.43,9.45,103.6,31.09,103.6,47.75S718.8,623.3,653.37,632.75z"/>
    </g>
    <text x="746" y="86" class="mono label">session Workflow</text>

    <rect x="574" y="156" width="98" height="32" rx="8" fill="#1E2033" stroke="#ED360E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="616" y="176" class="mono label" fill="#ED360E">Worker A</text>
    <g stroke="#ED360E" stroke-width="2" stroke-linecap="round">
      <line x1="656" y1="166" x2="664" y2="174"/><line x1="664" y1="166" x2="656" y2="174"/>
    </g>

    <rect x="688" y="156" width="98" height="32" rx="8" class="node"/>
    <text x="737" y="176" class="mono label">Worker B</text>

    <rect x="802" y="156" width="98" height="32" rx="8" class="node"/>
    <text x="851" y="176" class="mono label">Worker C</text>

    <rect x="672" y="236" width="152" height="32" rx="8" fill="#1E2033" stroke="#7C8FB1" stroke-width="1.5"/>
    <text x="748" y="256" class="mono label">session file</text>
  </g>
</svg>
