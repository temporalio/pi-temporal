<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">How a step runs, by default and stepped</title>
  <desc id="desc">By default one runStep Activity holds the model call, its tools and the seal. With PI_TEMPORAL_STEPPED=1 the model call, each tool call and the seal are separate Activities. Each tool call takes a dispatch claim before it runs, and the seal records the results before the next step.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#465A78" opacity="0.35"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#7C8FB1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#59FDA0"/>
    </marker>
    <style>
      .mono { font-family: "Noto Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .box { fill: #1E2033; stroke: #C7D7FE; stroke-width: 1.3; }
      .label { fill: #F8FAFC; font-size: 13px; text-anchor: middle; }
      .row { fill: #7C8FB1; font-size: 13px; }
      .note { fill: #7C8FB1; font-size: 12px; }
      .edge { stroke: #7C8FB1; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#161723"/>
  <rect width="960" height="360" fill="url(#dots)"/>

  <!-- Default: the whole step is one Activity -->
  <text x="40" y="58" class="mono row">default</text>
  <rect x="210" y="40" width="640" height="34" rx="7" class="box"/>
  <text x="530" y="62" class="mono label">runStep</text>
  <text x="530" y="96" class="mono note" text-anchor="middle">model call, its tools and the seal, in one Activity</text>

  <!-- Stepped: one Activity per unit -->
  <text x="40" y="150" class="mono" fill="#59FDA0" font-size="13">PI_TEMPORAL_STEPPED=1</text>

  <!-- model call fans out to the tool calls -->
  <path d="M 334,234 C 360,234 370,190 410,190" class="edge" marker-end="url(#arrow)"/>
  <line x1="334" y1="234" x2="408" y2="234" class="edge" marker-end="url(#arrow)"/>
  <path d="M 334,234 C 360,234 370,278 410,278" class="edge" marker-end="url(#arrow)"/>

  <!-- tool calls join at the seal -->
  <path d="M 572,190 C 612,190 622,234 648,234" class="edge" marker-end="url(#arrow)"/>
  <line x1="572" y1="234" x2="646" y2="234" class="edge"/>
  <path d="M 572,278 C 612,278 622,234 648,234" class="edge"/>

  <!-- the seal ends the step, and the next one starts at the model call -->
  <path d="M 712,252 C 712,326 270,326 270,254" fill="none" stroke="#59FDA0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="491" y="342" class="mono" fill="#59FDA0" font-size="12" text-anchor="middle">next step, until the model answers</text>

  <rect x="210" y="217" width="124" height="34" rx="7" class="box"/>
  <text x="272" y="239" class="mono label">runModelCall</text>

  <g>
    <rect x="412" y="173" width="160" height="34" rx="7" class="box"/>
    <text x="492" y="195" class="mono label">runToolCall</text>
    <rect x="412" y="217" width="160" height="34" rx="7" class="box"/>
    <text x="492" y="239" class="mono label">runToolCall</text>
    <rect x="412" y="261" width="160" height="34" rx="7" class="box"/>
    <text x="492" y="283" class="mono label">runToolCall</text>
  </g>
  <!-- each call takes its dispatch claim before the tool runs -->
  <g fill="#59FDA0">
    <circle cx="424" cy="190" r="3.5"/>
    <circle cx="424" cy="234" r="3.5"/>
    <circle cx="424" cy="278" r="3.5"/>
  </g>
  <text x="492" y="164" class="mono note" text-anchor="middle">one per call, each with its own retry and timeout</text>

  <rect x="650" y="217" width="124" height="34" rx="7" class="box"/>
  <text x="712" y="239" class="mono label">sealStep</text>
  <text x="790" y="230" class="mono note">records the</text>
  <text x="790" y="245" class="mono note">results in order</text>

  <!-- legend -->
  <circle cx="44" cy="278" r="3.5" fill="#59FDA0"/>
  <text x="54" y="282" class="mono note">dispatch claim,</text>
  <text x="54" y="297" class="mono note">taken before the</text>
  <text x="54" y="312" class="mono note">tool runs</text>
</svg>
